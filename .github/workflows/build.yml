name: Windows build
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore
        run: nuget restore A2ZSysIns.sln
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild A2ZSysIns.sln /p:Configuration=Release /p:Platform=x64 /m
      - name: Bundle official storage tools, PawnIO, and notices
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "smartmontools-7.5.win32-setup.exe"
          $smartRoot = Join-Path $env:RUNNER_TEMP "a2z-smartmontools"
          $binaryUrl = "https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.win32-setup.exe"
          $sourceUrl = "https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.tar.gz"
          Invoke-WebRequest -Uri $binaryUrl -OutFile $installer
          $header = Get-Content -Path $installer -AsByteStream -TotalCount 2
          if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) { throw "Official smartmontools mirror did not return a Windows executable." }
          Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$smartRoot") -Wait
          $smartctl = Get-ChildItem -Path $smartRoot -Filter smartctl.exe -Recurse | Select-Object -First 1
          if ($null -eq $smartctl) { throw "smartctl.exe was not found after installing the official package." }
          $output = "src/A2ZSysIns/bin/x64/Release/net48"
          $tools = Join-Path $output "tools"
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          Copy-Item -Path (Join-Path $smartctl.Directory.FullName '*') -Destination $tools -Recurse -Force
          Invoke-WebRequest -Uri $sourceUrl -OutFile (Join-Path $tools "smartmontools-7.5-source.tar.gz")

          # CrystalDiskInfo is obtained through its version-pinned Chocolatey
          # package because the SourceForge download endpoint can return a CDN
          # variant whose bytes do not match the published archive hash. The
          # package contains the upstream portable archive; we verify the ZIP
          # itself before extracting it.
          $cdiNupkg = Join-Path $env:RUNNER_TEMP "crystaldiskinfo.portable.9.9.2.nupkg"
          $cdiNupkgUrl = "https://community.chocolatey.org/api/v2/package/crystaldiskinfo.portable/9.9.2"
          Invoke-WebRequest -Uri $cdiNupkgUrl -OutFile $cdiNupkg
          $nupkgHeader = Get-Content -Path $cdiNupkg -AsByteStream -TotalCount 2
          if ($nupkgHeader[0] -ne 0x50 -or $nupkgHeader[1] -ne 0x4b) { throw "CrystalDiskInfo portable package did not return a ZIP/NuGet archive." }
          $nupkgExtract = Join-Path $env:RUNNER_TEMP "a2z-cdi-nupkg"
          $cdiExtract = Join-Path $env:RUNNER_TEMP "a2z-crystaldiskinfo"
          Remove-Item -Path $nupkgExtract,$cdiExtract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $cdiNupkg -DestinationPath $nupkgExtract -Force
          $cdiZip = Get-ChildItem -Path $nupkgExtract -Recurse -Filter "CrystalDiskInfo9_9_2.zip" | Select-Object -First 1
          if ($null -eq $cdiZip) { throw "CrystalDiskInfo 9.9.2 portable archive was not found inside the pinned package." }
          $cdiHash = (Get-FileHash $cdiZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($cdiHash -ne "01acb3176851a85824d9589c6514e3eb9771eb7f9d5ee58ed9b4e057bd21c7df") { throw "CrystalDiskInfo 9.9.2 upstream ZIP SHA-256 verification failed." }
          Expand-Archive -Path $cdiZip.FullName -DestinationPath $cdiExtract -Force
          $cdiExe = Get-ChildItem -Path $cdiExtract -Recurse -File | Where-Object { $_.Name -in @('DiskInfo64S.exe','DiskInfo64.exe') } | Select-Object -First 1
          if ($null -eq $cdiExe) { throw "CrystalDiskInfo portable executable was not found after extraction." }
          $cdiRoot = Join-Path $tools "CrystalDiskInfo"
          New-Item -ItemType Directory -Path $cdiRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $cdiExe.Directory.FullName '*') -Destination $cdiRoot -Recurse -Force
          $cdiRunner = Get-ChildItem -Path $cdiRoot -Filter "DiskInfo64*.exe" | Select-Object -First 1
          if ($null -eq $cdiRunner) { throw "CrystalDiskInfo executable was not copied into the application package." }
          & $cdiRunner.FullName /CopyExit
          if (-not (Test-Path (Join-Path $cdiRoot "DiskInfo.txt"))) { throw "CrystalDiskInfo /CopyExit did not create DiskInfo.txt." }
          Remove-Item -Path (Join-Path $cdiRoot "DiskInfo.txt") -Force -ErrorAction SilentlyContinue

          # PawnIO is an optional hardware-access helper. Keep the verified
          # installer in the artifact, but do not make the application build
          # depend on an unverified installer checksum.
          $pawnDir = Join-Path $tools "pawnio/2.2.0"
          New-Item -ItemType Directory -Path $pawnDir -Force | Out-Null
          $pawnUrl = "https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe"
          $pawnInstaller = Join-Path $pawnDir "PawnIO_setup.exe"
          Invoke-WebRequest -Uri $pawnUrl -OutFile $pawnInstaller
          $pawnHeader = Get-Content -Path $pawnInstaller -AsByteStream -TotalCount 2
          if ($pawnHeader[0] -ne 0x4d -or $pawnHeader[1] -ne 0x5a) { throw "PawnIO release did not return a Windows executable." }

          Copy-Item -Path "THIRD_PARTY_NOTICES.md" -Destination $output -Force
          & (Join-Path $tools "smartctl.exe") --version
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: A2Z-System-Inspector-Windows-x64
          path: src/A2ZSysIns/bin/x64/Release/**
